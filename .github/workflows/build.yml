name: Build Flutter APK

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'lili-app/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: lili-app
        run: flutter create --platforms=android --org com.lili --project-name lili_watch .

      - name: Configure Android manifest
        working-directory: lili-app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Add INTERNET permission (release manifest lacks it by default)
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$MANIFEST"
          # Set app label
          sed -i 's#android:label="[^"]*"#android:label="Lili Watch"#' "$MANIFEST"
          # Allow cleartext traffic (for optional local http server testing)
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$MANIFEST"
          echo "----- Final AndroidManifest.xml -----"
          cat "$MANIFEST"

      - name: Get dependencies
        working-directory: lili-app
        run: flutter pub get

      - name: Build APK
        working-directory: lili-app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lili-watch-apk
          path: lili-app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
