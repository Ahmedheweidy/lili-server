name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'lili-app/**'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: lili-app
        run: flutter pub get

      - name: Build APK
        working-directory: lili-app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lili-watch-apk
          path: lili-app/build/outputs/flutter-apk/app-release.apk
          retention-days: 30
